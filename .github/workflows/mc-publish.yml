name: Auto MC Publish

on:
  push:
    branches: [ 1.21.1-new, main ]

jobs:
  publish:
    if: startsWith(github.event.head_commit.message, 'Bump version')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Mod
        run: ./gradlew build

      - name: Parse Metadata
        id: meta
        env:
          CF_TOKEN_VAL: ${{ secrets.CURSEFORGE_TOKEN }}
          MR_TOKEN_VAL: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          RAW_MSG="${{ github.event.head_commit.message }}"
          FIRST_LINE=$(echo "$RAW_MSG" | head -n 1)
          MC_VER=$(echo "$FIRST_LINE" | awk '{print $3}')
          MOD_VER=$(echo "$FIRST_LINE" | awk '{print $4}')
          CHANGELOG=$(echo "$RAW_MSG" | sed '1d')
          DISPLAY_NAME="${MC_VER} v${MOD_VER}"
          
          JAR_PATH=$(ls build/libs/*.jar | grep -v "-sources" | grep -v "-dev" | head -n 1)
          
          echo "mc_ver=$MC_VER" >> $GITHUB_OUTPUT
          echo "mod_ver=$MOD_VER" >> $GITHUB_OUTPUT
          echo "display_name=$DISPLAY_NAME" >> $GITHUB_OUTPUT
          echo "jar_path=$JAR_PATH" >> $GITHUB_OUTPUT
          
          # 检查 Token 是否存在并导出标志
          if [ -n "$CF_TOKEN_VAL" ]; then echo "has_cf=true" >> $GITHUB_OUTPUT; else echo "has_cf=false" >> $GITHUB_OUTPUT; fi
          if [ -n "$MR_TOKEN_VAL" ]; then echo "has_mr=true" >> $GITHUB_OUTPUT; else echo "has_mr=false" >> $GITHUB_OUTPUT; fi
          
          echo "$CHANGELOG" > changelog.md

      - name: Upload to CurseForge
        if: steps.meta.outputs.has_cf == 'true'
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CF_PROJECT: "841298"
        run: |
          METADATA=$(jq -n --arg cl "$(cat changelog.md)" --arg dn "${{ steps.meta.outputs.display_name }}" \
            '{changelog: $cl, changelogType: "markdown", displayName: $dn, gameVersions: [10236], releaseType: "release"}')
          
          curl -X POST "https://minecraft.curseforge.com/api/projects/${CF_PROJECT}/upload-file" \
               -H "X-Api-Token: ${CF_TOKEN}" \
               -F "metadata=${METADATA}" \
               -F "file=@${{ steps.meta.outputs.jar_path }}"

      - name: Upload to Modrinth
        if: steps.meta.outputs.has_mr == 'true'
        env:
          MR_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MR_PROJECT: "你的_MODRINTH_ID" # 如果有具体的 Modrinth ID 请修改
        run: |
          METADATA=$(jq -n \
            --arg name "${{ steps.meta.outputs.display_name }}" \
            --arg ver "${{ steps.meta.outputs.mod_ver }}" \
            --arg cl "$(cat changelog.md)" \
            --arg pid "${MR_PROJECT}" \
            --arg mc "${{ steps.meta.outputs.mc_ver }}" \
            '{
              name: $name,
              version_number: $ver,
              changelog: $cl,
              game_versions: [$mc],
              version_type: "release",
              loaders: ["neoforge"],
              project_id: $pid,
              file_parts: ["file"]
            }')

          curl -X POST "https://api.modrinth.com/v2/version" \
               -H "Authorization: ${MR_TOKEN}" \
               -F "data=${METADATA}" \
               -F "file=@${{ steps.meta.outputs.jar_path }}"
